
name: Build GrassSSH APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Prepare signing keystores
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -noprompt \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          cp debug.keystore "${{ runner.temp }}/upload.jks"
          keytool -changealias \
            -alias androiddebugkey \
            -destalias upload \
            -keystore "${{ runner.temp }}/upload.jks" \
            -storepass android \
            -keypass android

      - name: Verify Firebase config files
        run: |
          test -f app/google-services.json
          test -f app/src/main/res/values/firebase_applet_config.xml

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: gradle :app:assembleRelease --no-daemon

      - name: Upload GrassSSH APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GrassSSH-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          
